<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Reports — Print Plan</title>
<style>
  :root {
    --bg: #fafaf9;
    --card: #ffffff;
    --border: #e7e5e4;
    --text: #1c1917;
    --muted: #78716c;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --green: #16a34a;
    --green-soft: #f0fdf4;
    --amber: #b45309;
    --amber-soft: #fffbeb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 48px 24px;
    line-height: 1.5;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { margin-bottom: 36px; }
  header .kicker {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  header p { color: var(--muted); font-size: 15px; margin-top: 8px; }
  .grid { display: grid; gap: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 26px;
    box-shadow: 0 1px 2px rgba(28, 25, 23, 0.04);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .card:hover {
    box-shadow: 0 8px 24px rgba(28, 25, 23, 0.08);
    transform: translateY(-1px);
  }
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .card-head h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .pages-badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .rows { display: grid; gap: 12px; }
  .row {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
  }
  .row-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .row.print .row-label { color: var(--green); }
  .row.handwrite .row-label { color: var(--amber); }
  .tree {
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: 13px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, max-content));
    gap: 4px 28px;
    white-space: nowrap;
  }
  .tree span { color: var(--muted); }
  .tree a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s ease;
  }
  .tree a:hover { border-bottom-color: var(--accent); }
  .row-footer {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .row-footer a {
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 2px;
    transition: color 0.15s ease;
  }
  .row-footer a:hover { color: var(--accent); }
  footer { margin-top: 40px; text-align: center; font-size: 12.5px; color: var(--muted); }
  @media (max-width: 640px) {
    body { padding: 28px 14px; }
    .card-head { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">BTech 3rd Semester · Python Lab</div>
    <h1>Weekly Reports — Print Plan</h1>
    <p>Pages to print for the final report, and pages left blank for handwritten work.</p>
  </header>

  <main class="grid" id="cards"></main>

  <footer>Generated from <code>3rdSem/PROJECTS/PYTHON/docx/FinalWeeklyReport/pdf</code></footer>
</div>

<script>
  const base = "3rdSem/PROJECTS/PYTHON/docx/FinalWeeklyReport/pdf";
  const weeks = [
    { n: 1, total: 6, title: "Student Grade Management System", print: [1, 3, 4, 6] },
    { n: 2, total: 8, title: "Electricity Bill Calculator & ATM Simulator", print: [1, 4, 5, 6, 8] },
    { n: 3, total: 9, title: "Bank, Hotel & Library Systems", print: [1, 3, 5, 7, 9] },
    { n: 4, total: 7, title: "Password Strength & Email Validation", print: [1, 3, 5, 7] }
  ];

  const u = (p) => encodeURI(p);
  const pageLink = (week, kind, page) =>
    `${u(base)}/split/Week${week}/${kind}/page-${String(page).padStart(2, "0")}.pdf`;

  const original = {
    1: `${u(base)}/Week1_(print 1,3,4,6 pages)_Student_Grade_Management_System_Report.pdf`,
    2: `${u(base)}/Week2_(print 1,4,5,6,8 pages)_Electricity_Bill_Calculator_and_ATM_Simulator_Report.pdf`,
    3: `${u(base)}/Week3_(print 1,3,5,7,9 pages)_Combined_Report_Bank_Hotel_Library.pdf`,
    4: `${u(base)}/Week4_(print 1,3,5,7 pages)_Password_Strength_Email_Validation_Report.pdf`
  };

  const root = document.getElementById("cards");
  weeks.forEach(w => {
    const handwrite = [];
    for (let p = 1; p <= w.total; p++) if (!w.print.includes(p)) handwrite.push(p);

    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="card-head">
        <h2>Week ${w.n} <span style="font-weight:500;color:var(--muted)">· ${w.title}</span></h2>
        <span class="pages-badge">${w.total} pages</span>
      </div>
      <div class="rows">
        <div class="row print">
          <div class="row-label">Print Pages</div>
          <div class="tree">
            ${w.print.map((p, i) =>
              `<span>${i === w.print.length - 1 ? "└─" : "├─"} </span>` +
              `<a href="${pageLink(w.n, "print", p)}" target="_blank">Page ${p}</a>`
            ).join("")}
          </div>
        </div>
        <div class="row handwrite">
          <div class="row-label">Handwrite Only</div>
          <div class="tree">
            ${handwrite.map((p, i) =>
              `<span>${i === handwrite.length - 1 ? "└─" : "├─"} </span>` +
              `<a href="${pageLink(w.n, "handwrite", p)}" target="_blank">Page ${p}</a>`
            ).join("")}
          </div>
        </div>
        <div class="row-footer">
          Print list: <span style="font-family:monospace;color:var(--text)">${w.print.join(", ")}</span>
          · Handwrite: <span style="font-family:monospace;color:var(--text)">${handwrite.join(", ")}</span>
          · <a href="${u(original[w.n])}" target="_blank">Open full PDF</a>
        </div>
      </div>`;
    root.appendChild(card);
  });
</script>
</body>
</html>
